model = "gpt-6.1-terra"
model_reasoning_effort = "xhigh"

[features]
hooks = true

[tui]
animations = true
screen_reader_detection_done = true
theme = "catppuccin-mocha"
status_line_use_colors = true
status_line = ["model-with-reasoning", "project-name", "git-branch", "context-used", "five-hour-limit", "weekly-limit"]
terminal_title = ["activity", "thread-name", "project-name"]
notifications = true
right_click_paste = "off"

[tui.model_availability_nux]
"gpt-6.1-sol" = 1

[tui.effects]
starfield = true
